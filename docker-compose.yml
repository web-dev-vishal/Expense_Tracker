version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: expense_tracker_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - expense_network

volumes:
  mongodb_data:
    driver: local

networks:
  expense_network:
    driver: bridge