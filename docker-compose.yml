version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: expense_tracker_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - expense_network

  redis:
    image: redis:latest
    container_name: expense_tracker_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - expense_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: expense_tracker_rabbitmq
    restart: always
    ports:
      - "5672:5672"      # RabbitMQ main port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - expense_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  

networks:
  expense_network:
    driver: bridge